<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Business Card</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <div class="business-card">
        <img src="https://images.unsplash.com/photo-1511367461989-f85a21fda167?&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8cHJvZmlsZXxlbnwwfHwwfHx8MA%3D%3D" class="profile-image" alt="black and blue avatar" />
        <p class="full-name">John Doe</p>
        <p class="designation">Web Responsive Design</p>
        <p class="company">Digital Works</p>
        <hr>
        <p>Email Address</p>
        <p>Contact us</p>
        <a href="#" class="portfolio">View Portfolio</a>
        <hr>
        <div class="social-media">
          <h2>Connect with me</h2>
        <a href="#">Twitter</a>
        <a href="#">LinkedIn</a>
        <a href="#">GitHub</a>
        </div>
      </div>
    </main>
  </body>
</html>
