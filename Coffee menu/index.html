<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Menu</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <div class="menu">
    <main>
        <h1>RUMBA CAFE</h1>
        <p class="established">EST 2026</p>
<hr>
            <section>
            <h2>Coffee Menu</h2>
            
            <img src="https://cdn-icons-png.flaticon.com/128/3219/3219300.png"  class="coffee-icon" alt="coffee icon" />

            <article class="item">
            <p class="flavor">Coffee</p>
            <p class="price">R7.50</p>
            </article>

            <article class="item">
            <p class="flavor">Latte</p>
            <p class="price">R6.00</p>
            </article>

            <article class="item">
            <p class="flavor">Hazelnut Mocha</p>
            <p class="price">R13.50</p>
            </article>
        
            <article class="item">
                <p class="flavor">Cappuccino</p>
                <p class="price">R14.25</p>
            </article>

            <article class="item">
                <p class="flavor">Espresso</p>
                <p class="price">R12.25</p>
            </article>
        </section>

            <section>
                <h2>Dessert Menu</h2>
                
                <img src="https://cdn-icons-png.flaticon.com/128/8346/8346809.png" class="dessert-icon"  alt="dessert icon"/>
                
                <article class="item">
                    <p class="dessert">Chocolate Cake</p>
                    <p class="price">R5.50</p>
                </article>
                
                <article class="item">
                    <p class="dessert">Cheesecake</p>
                    <p class="price">R8.50</p>
                </article>

                <article class="item">
                    <p class="dessert">Tiramisu</p>
                    <p class="price">R10.10</p>
                </article>

                <article class="item">
                    <p class="dessert">Apple Pie</p>
                    <p class="price">R5.30</p>
                </article>
        </section>
    </main>

    <hr class="bottom-line">
    <footer>
        <address>
            <p class="address"><a href="https://www.rumbacafe.com" target="_blank">Visit Our Website</a></p>
            <p>123 Coffee Street, Caffeine City</p>
        </address>
    </footer>
    </div>
</body>
</html>
